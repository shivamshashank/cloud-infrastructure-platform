name: Publish to ECR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.ENABLE_ECR_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check ECR role configuration
        env:
          AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ECR_PUBLISH_ROLE_ARN" ]; then
            echo "::error::Set AWS_ECR_PUBLISH_ROLE_ARN before enabling ECR publishing."
            exit 1
          fi

      - name: Check out the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify ECR repository exists
        run: aws ecr describe-repositories --repository-names cloud-infrastructure-platform --region us-east-1 > /dev/null

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and publish API and migration images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          repo="$REGISTRY/cloud-infrastructure-platform"
          docker build --target api -t "$repo:api-$SOURCE_SHA" .
          docker build --target migrate -t "$repo:migrate-$SOURCE_SHA" .
          for tag in "api-$SOURCE_SHA" "migrate-$SOURCE_SHA"; do
            if aws ecr describe-images --repository-name cloud-infrastructure-platform --image-ids "imageTag=$tag" --region us-east-1 > /dev/null 2>&1; then
              echo "$tag already exists; keeping its immutable image."
            else
              docker push "$repo:$tag"
            fi
            digest="$(aws ecr describe-images --repository-name cloud-infrastructure-platform --image-ids "imageTag=$tag" --region us-east-1 --query 'imageDetails[0].imageDigest' --output text)"
            echo "$repo@$digest" >> "$GITHUB_STEP_SUMMARY"
          done
