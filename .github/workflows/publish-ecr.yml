name: Publish to ECR

on:
  push:
    branches: [main]

jobs:
  verify:
    if: ${{ vars.ENABLE_ECR_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - name: Require a merged pull request and successful CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pulls="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls")"
          if ! jq -e --arg sha "$SOURCE_SHA" \
            'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)' \
            <<< "$pulls" > /dev/null; then
            echo 'No merged pull request introduced this main commit; skipping ECR publishing.'
            exit 0
          fi

          for attempt in {1..40}; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&branch=main&per_page=20")"
            conclusion="$(jq -r --arg sha "$SOURCE_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .conclusion // empty' \
              <<< "$runs")"
            if [ "$conclusion" = success ]; then
              echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "::error::CI concluded $conclusion for $SOURCE_SHA; refusing to publish."
              exit 1
            fi
            echo "Waiting for CI on $SOURCE_SHA (attempt $attempt/40)."
            sleep 20
          done
          echo "::error::CI did not finish for $SOURCE_SHA within the wait period."
          exit 1

  publish:
    needs: verify
    if: ${{ needs.verify.outputs.source_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check ECR role configuration
        env:
          AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ECR_PUBLISH_ROLE_ARN" ]; then
            echo "::error::Set AWS_ECR_PUBLISH_ROLE_ARN before enabling ECR publishing."
            exit 1
          fi

      - name: Check out the merge commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Find the public ECR repository
        id: repo
        run: |
          uri="$(aws ecr-public describe-repositories --repository-names cloud-infrastructure-platform --region us-east-1 --query 'repositories[0].repositoryUri' --output text)"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR Public
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: Build and publish API and migration images
        env:
          REPO_URI: ${{ steps.repo.outputs.uri }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          repo="$REPO_URI"
          docker build --target api -t "$repo:api-$SOURCE_SHA" .
          docker build --target migrate -t "$repo:migrate-$SOURCE_SHA" .
          for tag in "api-$SOURCE_SHA" "migrate-$SOURCE_SHA"; do
            if aws ecr-public describe-images --repository-name cloud-infrastructure-platform --image-ids "imageTag=$tag" --region us-east-1 > /dev/null 2>&1; then
              echo "$tag already exists; leaving the published image unchanged."
            else
              docker push "$repo:$tag"
            fi
            digest="$(aws ecr-public describe-images --repository-name cloud-infrastructure-platform --image-ids "imageTag=$tag" --region us-east-1 --query 'imageDetails[0].imageDigest' --output text)"
            echo "$repo@$digest" >> "$GITHUB_STEP_SUMMARY"
          done
