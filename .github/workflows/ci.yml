name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Test with PostgreSQL and collect coverage
        env:
          TEST_DATABASE_URL: postgres://tasks:localdev@127.0.0.1:5432/tasks_test?sslmode=disable
        run: go test -race -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build container images
        env:
          POSTGRES_PASSWORD: localdev
        run: docker compose build api migrate

      - name: Export images for scanning
        run: |
          docker save --output api-image.tar cloud-infrastructure-platform-api:latest
          docker save --output migrate-image.tar cloud-infrastructure-platform-migrate:latest

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          input: ./api-image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Scan migration image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          input: ./migrate-image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Check SonarQube Cloud token
        id: sonar_token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ENABLE_ECR_PUBLISH: ${{ vars.ENABLE_ECR_PUBLISH }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            if [ "$ENABLE_ECR_PUBLISH" = 'true' ]; then
              echo "::error::SONAR_TOKEN is required before enabling ECR publishing."
              exit 1
            fi
            echo "::warning::Set the SONAR_TOKEN repository secret to enable SonarQube Cloud analysis."
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Analyze code with SonarQube Cloud
        if: ${{ steps.sonar_token.outputs.configured == 'true' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Check Codecov token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error::Add CODECOV_TOKEN in repository Actions secrets to enable coverage uploads."
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          files: ./coverage.out
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
