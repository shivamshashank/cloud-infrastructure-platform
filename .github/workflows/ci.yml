name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Test with PostgreSQL and collect coverage
        env:
          TEST_DATABASE_URL: postgres://tasks:localdev@127.0.0.1:5432/tasks_test?sslmode=disable
        run: go test -race -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check Codecov token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error::Add CODECOV_TOKEN in repository Actions secrets to enable coverage uploads."
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          files: ./coverage.out
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
